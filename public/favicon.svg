<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Warehouse Isometric Box & Geometry -->
  <g transform="translate(256, 250)">
    <!-- Top Face -->
    <polygon points="0,-110 120,-45 0,20 -120,-45" fill="#818cf8" stroke="#c7d2fe" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Left Face -->
    <polygon points="-120,-45 0,20 0,145 -120,80" fill="#4338ca" stroke="#c7d2fe" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Right Face -->
    <polygon points="0,20 120,-45 120,80 0,145" fill="#312e81" stroke="#c7d2fe" stroke-width="3" stroke-linejoin="round"/>

    <!-- Inner Grid Lines / Warehouse Shelving Accent -->
    <line x1="0" y1="20" x2="0" y2="145" stroke="#a5b4fc" stroke-width="4"/>
    <line x1="-60" y1="-12" x2="-60" y2="112" stroke="#6366f1" stroke-width="3" stroke-dasharray="6,4"/>
    <line x1="60" y1="-12" x2="60" y2="112" stroke="#6366f1" stroke-width="3" stroke-dasharray="6,4"/>

    <!-- Emerald Dynamic Status Indicator Tag -->
    <circle cx="0" cy="-45" r="18" fill="url(#accentGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="-45" r="9" fill="#ecfdf5"/>
  </g>

  <!-- Typography JW Badge -->
  <text x="256" y="445" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="6">JUWEI WMS</text>
</svg>
