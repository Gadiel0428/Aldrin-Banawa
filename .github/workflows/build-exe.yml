name: Build Windows EXE Installer

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Locate project directory
        id: locate
        shell: powershell
        run: |
          $root = (Get-Location).ProviderPath
          $pkg = Get-ChildItem -Path $root -Recurse -Filter "package.json" | Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' } | Select-Object -First 1

          if (-not $pkg) {
            Write-Error "Could not find package.json anywhere in repository."
            exit 1
          }

          $dirPath = $pkg.DirectoryName
          if ($dirPath.StartsWith($root, [System.StringComparison]::OrdinalIgnoreCase)) {
            $rel = $dirPath.Substring($root.Length).TrimStart('\', '/')
            if ([string]::IsNullOrWhiteSpace($rel)) {
              $rel = "."
            }
          } else {
            $rel = "."
          }

          Write-Host "Project directory located at relative path: '$rel'"
          "dir=$rel" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm install

      - name: Build Windows EXE Setup
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:exe

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JUWEI-WMS-Desktop-Installer
          path: |
            ${{ steps.locate.outputs.dir }}/release/*.exe
            release/*.exe


