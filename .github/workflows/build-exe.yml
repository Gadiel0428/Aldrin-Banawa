name: Build Windows EXE Installer

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate project directory
        id: locate
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            function findPkg(dir) {
              try {
                const files = fs.readdirSync(dir, { withFileTypes: true });
                for (const f of files) {
                  if (f.name === 'node_modules' || f.name.startsWith('.')) continue;
                  const full = path.join(dir, f.name);
                  if (f.isFile() && f.name === 'package.json') return dir;
                  if (f.isDirectory()) {
                    const res = findPkg(full);
                    if (res) return res;
                  }
                }
              } catch (e) {}
              return null;
            }
            const root = process.cwd();
            const pkgDir = findPkg(root) || root;
            let rel = path.relative(root, pkgDir).replace(/\\\\/g, '/');
            if (!rel) rel = '.';
            console.log('Found package.json in relative path:', rel);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'dir=' + rel + '\n');
          "

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm install

      - name: Build Windows EXE Setup
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:exe

      - name: Publish EXE to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = "${{ steps.locate.outputs.dir }}"
          $searchPaths = @(
            "$dir/release/*.exe",
            "release/*.exe",
            "$dir/dist/*.exe",
            "dist/*.exe"
          )
          
          $files = @()
          foreach ($p in $searchPaths) {
            $matched = Get-ChildItem -Path $p -ErrorAction SilentlyContinue
            if ($matched) {
              $files += $matched.FullName
            }
          }
          $files = $files | Select-Object -Unique

          if (-not $files -or $files.Count -eq 0) {
            Write-Warning "No .exe binaries found in release folders."
            exit 0
          }

          Write-Host "Found executable files:"
          $files | ForEach-Object { Write-Host " - $_" }

          $tag = if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}") {
            "${{ github.ref_name }}"
          } else {
            "v1.0.${{ github.run_number }}"
          }

          Write-Host "Creating GitHub Release with tag: $tag"
          
          # Delete existing release with this tag if it exists to avoid conflicts
          gh release delete $tag --yes --cleanup-tag 2>$null
          
          # Create fresh release and upload files directly (bypasses Actions artifact quota)
          gh release create $tag $files --title "JUWEI WMS Desktop $tag" --notes "Production Windows EXE Installer and Standalone Binary built from commit ${{ github.sha }}."
          
          Write-Host "Successfully published Windows EXE to GitHub Releases!"




