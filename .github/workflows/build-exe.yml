name: Build Windows EXE Installer

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate project directory
        id: locate
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            function findPkg(dir) {
              try {
                const files = fs.readdirSync(dir, { withFileTypes: true });
                for (const f of files) {
                  if (f.name === 'node_modules' || f.name.startsWith('.')) continue;
                  const full = path.join(dir, f.name);
                  if (f.isFile() && f.name === 'package.json') return dir;
                  if (f.isDirectory()) {
                    const res = findPkg(full);
                    if (res) return res;
                  }
                }
              } catch (e) {}
              return null;
            }
            const root = process.cwd();
            const pkgDir = findPkg(root) || root;
            let rel = path.relative(root, pkgDir).replace(/\\\\/g, '/');
            if (!rel) rel = '.';
            console.log('Found package.json in relative path:', rel);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'dir=' + rel + '\n');
          "

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm install

      - name: Build Windows EXE Setup
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:exe

      - name: Upload Installer Artifact (Actions)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: JUWEI-WMS-Desktop-Installer
          retention-days: 1
          compression-level: 9
          if-no-files-found: warn
          path: |
            ${{ steps.locate.outputs.dir }}/release/*.exe
            release/*.exe

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest-build
          name: JUWEI WMS Desktop Latest Release
          body: |
            Automated production build of JUWEI Warehouse Management System Desktop (.exe).
            - Built on: ${{ github.event.head_commit.timestamp || 'Latest commit' }}
            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.locate.outputs.dir }}/release/*.exe
            release/*.exe



