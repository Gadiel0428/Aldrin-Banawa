name: Build Windows EXE Installer

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate project directory
        id: locate
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            function findPkg(dir) {
              try {
                const files = fs.readdirSync(dir, { withFileTypes: true });
                for (const f of files) {
                  if (f.name === 'node_modules' || f.name.startsWith('.')) continue;
                  const full = path.join(dir, f.name);
                  if (f.isFile() && f.name === 'package.json') return dir;
                  if (f.isDirectory()) {
                    const res = findPkg(full);
                    if (res) return res;
                  }
                }
              } catch (e) {}
              return null;
            }
            const root = process.cwd();
            const pkgDir = findPkg(root) || root;
            let rel = path.relative(root, pkgDir).replace(/\\\\/g, '/');
            if (!rel) rel = '.';
            console.log('Found package.json in relative path:', rel);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'dir=' + rel + '\n');
          "

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm install

      - name: Sync Version from GitHub
        id: versioning
        shell: pwsh
        run: |
          $dir = "${{ steps.locate.outputs.dir }}"
          $tag = if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}") {
            "${{ github.ref_name }}"
          } else {
            "v1.0.${{ github.run_number }}"
          }
          $cleanVersion = $tag -replace '^[vV]', ''
          Write-Host "Authoritative GitHub Release Version: $cleanVersion (Tag: $tag)"

          $pkgPath = Join-Path $dir "package.json"
          if (-not (Test-Path $pkgPath)) {
            throw "package.json not found at $pkgPath"
          }

          $env:PKG_PATH = $pkgPath
          $env:CLEAN_VERSION = $cleanVersion
          node -e "
            const fs = require('fs');
            const p = process.env.PKG_PATH;
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = process.env.CLEAN_VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n', 'utf8');
          "
          if ($LASTEXITCODE -ne 0) { throw "Failed to update package.json version" }
          Write-Host "Synced package.json version to $cleanVersion"

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$cleanVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run Lint (TypeScript & strict modules)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm run lint

      - name: Build Application and Server Bundle
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          BUILD_VERSION: ${{ steps.versioning.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Start Server and Run Multi-User Sync Verification
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testDataDir = Join-Path $env:RUNNER_TEMP "juwei-ci-sync-data"
          New-Item -ItemType Directory -Force -Path $testDataDir | Out-Null
          $stdoutLog = Join-Path $env:RUNNER_TEMP "juwei-server-stdout.log"
          $stderrLog = Join-Path $env:RUNNER_TEMP "juwei-server-stderr.log"

          $env:PORT = "3000"
          $env:NODE_ENV = "production"
          $env:JUWEI_DATA_DIR = $testDataDir
          $env:LOG_LEVEL = "info"

          $proc = Start-Process -FilePath "node" -ArgumentList "dist/server.cjs" -PassThru -NoNewWindow -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($proc.HasExited) {
                throw "Server exited prematurely with code $($proc.ExitCode)"
              }
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:3000/api/health" -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "Server failed to respond on /api/health within 30 seconds"
            }

            node scripts/test-multi-user-sync.mjs
            if ($LASTEXITCODE -ne 0) {
              throw "scripts/test-multi-user-sync.mjs failed with exit code $LASTEXITCODE"
            }
          } catch {
            if (Test-Path $stdoutLog) {
              Write-Host "=== SERVER STDOUT ==="
              Get-Content $stdoutLog
            }
            if (Test-Path $stderrLog) {
              Write-Host "=== SERVER STDERR ==="
              Get-Content $stderrLog
            }
            throw
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            Remove-Item -Path $testDataDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Build Windows EXE Setup
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_VERSION: ${{ steps.versioning.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run dist:exe

      - name: Publish EXE to GitHub Releases and Generate Download Summary
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = "${{ steps.locate.outputs.dir }}"
          $searchPaths = @(
            "$dir/release/*.exe",
            "release/*.exe",
            "$dir/dist/*.exe",
            "dist/*.exe"
          )
          
          $files = @()
          foreach ($p in $searchPaths) {
            $matched = Get-ChildItem -Path $p -ErrorAction SilentlyContinue
            if ($matched) {
              $files += $matched.FullName
            }
          }
          $files = $files | Select-Object -Unique

          if (-not $files -or $files.Count -eq 0) {
            Write-Warning "No .exe binaries found in release folders."
            "## ⚠️ Build Warning`nNo .exe executable files were found to publish." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          Write-Host "Found executable files:"
          $files | ForEach-Object { Write-Host " - $_" }

          $tag = if ("${{ steps.versioning.outputs.tag }}") {
            "${{ steps.versioning.outputs.tag }}"
          } elseif ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}") {
            "${{ github.ref_name }}"
          } else {
            "v1.0.${{ github.run_number }}"
          }
          $cleanVersion = $tag.TrimStart('v').TrimStart('V')

          Write-Host "Creating GitHub Release with tag: $tag"
          
          # Delete existing release with this tag if it exists to avoid conflicts
          gh release delete $tag --yes --cleanup-tag 2>$null
          
          # Create fresh release and upload files directly (bypasses Actions artifact quota)
          gh release create $tag $files --title "JUWEI WMS Desktop $tag" --notes "Official Production Windows EXE Installer and Standalone Binary."
          
          $repo = "${{ github.repository }}"
          $releaseUrl = "https://github.com/$repo/releases/tag/$tag"
          
          Write-Host "Successfully published Windows EXE to GitHub Releases at $releaseUrl"

          # Write rich download summary to GitHub Actions summary page
          $summary = @"
          # 🎉 JUWEI WMS Windows EXE Ready for Download!

          ### 📦 [Click Here to Open GitHub Release & Download EXE]($releaseUrl)

          | Binary File | Direct Download Link | Size |
          | :--- | :--- | :--- |
          "@

          foreach ($f in $files) {
            $fileName = [System.IO.Path]::GetFileName($f)
            $fileSizeMB = [math]::Round(((Get-Item $f).Length / 1MB), 2)
            $downloadUrl = "https://github.com/$repo/releases/download/$tag/$([System.Uri]::EscapeDataString($fileName))"
            $summary += "`n          | **$fileName** | [⬇️ **Download $fileName**]($downloadUrl) | $fileSizeMB MB |"
          }

          $summary += @"

          ---
          ### 🚀 Installation Instructions:
          1. Click any **Download Link** above (or visit the [Releases Page]($releaseUrl)).
          2. Run the downloaded **`.exe`** file on any Windows 10 / 11 computer.
          3. Enjoy **JUWEI WMS Desktop** with full real-time database sync and zero Google icons.
          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Artifacts to Actions Summary (Backup)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: JUWEI-WMS-Desktop-Windows-EXE
          retention-days: 1
          compression-level: 9
          if-no-files-found: warn
          path: |
            ${{ steps.locate.outputs.dir }}/release/*.exe
            release/*.exe
            ${{ steps.locate.outputs.dir }}/dist/*.exe
            dist/*.exe




