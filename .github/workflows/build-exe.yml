name: Build Windows EXE Installer

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE Setup
        run: npm run dist:exe

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JUWEI-WMS-Desktop-Installer
          path: |
            release/*.exe
            release/*.zip
