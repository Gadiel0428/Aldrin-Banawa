name: Build Windows EXE Installer

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate project directory
        id: locate
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            function findPkg(dir) {
              try {
                const files = fs.readdirSync(dir, { withFileTypes: true });
                for (const f of files) {
                  if (f.name === 'node_modules' || f.name.startsWith('.')) continue;
                  const full = path.join(dir, f.name);
                  if (f.isFile() && f.name === 'package.json') return dir;
                  if (f.isDirectory()) {
                    const res = findPkg(full);
                    if (res) return res;
                  }
                }
              } catch (e) {}
              return null;
            }
            const root = process.cwd();
            const pkgDir = findPkg(root) || root;
            let rel = path.relative(root, pkgDir).replace(/\\\\/g, '/');
            if (!rel) rel = '.';
            console.log('Found package.json in relative path:', rel);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'dir=' + rel + '\n');
          "

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm install

      - name: Sync Version from GitHub
        id: versioning
        shell: pwsh
        run: |
          $dir = "${{ steps.locate.outputs.dir }}"
          $tag = if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}") {
            "${{ github.ref_name }}"
          } else {
            "v1.0.${{ github.run_number }}"
          }
          $cleanVersion = $tag.TrimStart('v').TrimStart('V')
          Write-Host "Authoritative GitHub Release Version: $cleanVersion (Tag: $tag)"

          # Update package.json version BEFORE compiling so electron-builder names the .exe binaries matching the GitHub release exactly
          $pkgPath = "$dir/package.json"
          if (Test-Path $pkgPath) {
            $content = Get-Content -Raw $pkgPath | ConvertFrom-Json
            $content.version = $cleanVersion
            $content | ConvertTo-Json -Depth 10 | Set-Content -Path $pkgPath -Encoding utf8
            Write-Host "Synced package.json version to $cleanVersion"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$cleanVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Windows EXE Setup
        working-directory: ${{ steps.locate.outputs.dir }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:exe

      - name: Publish EXE to GitHub Releases and Generate Download Summary
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = "${{ steps.locate.outputs.dir }}"
          $searchPaths = @(
            "$dir/release/*.exe",
            "release/*.exe",
            "$dir/dist/*.exe",
            "dist/*.exe"
          )
          
          $files = @()
          foreach ($p in $searchPaths) {
            $matched = Get-ChildItem -Path $p -ErrorAction SilentlyContinue
            if ($matched) {
              $files += $matched.FullName
            }
          }
          $files = $files | Select-Object -Unique

          if (-not $files -or $files.Count -eq 0) {
            Write-Warning "No .exe binaries found in release folders."
            "## ⚠️ Build Warning`nNo .exe executable files were found to publish." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          Write-Host "Found executable files:"
          $files | ForEach-Object { Write-Host " - $_" }

          $tag = if ("${{ steps.versioning.outputs.tag }}") {
            "${{ steps.versioning.outputs.tag }}"
          } elseif ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}") {
            "${{ github.ref_name }}"
          } else {
            "v1.0.${{ github.run_number }}"
          }
          $cleanVersion = $tag.TrimStart('v').TrimStart('V')

          Write-Host "Creating GitHub Release with tag: $tag"
          
          # Delete existing release with this tag if it exists to avoid conflicts
          gh release delete $tag --yes --cleanup-tag 2>$null
          
          # Create fresh release and upload files directly (bypasses Actions artifact quota)
          gh release create $tag $files --title "JUWEI WMS Desktop $tag" --notes "Official Production Windows EXE Installer and Standalone Binary."
          
          $repo = "${{ github.repository }}"
          $releaseUrl = "https://github.com/$repo/releases/tag/$tag"
          
          Write-Host "Successfully published Windows EXE to GitHub Releases at $releaseUrl"

          # Notify Central Production Server so all web clients and desktops immediately reflect the latest GitHub release
          try {
            $syncPayload = @{
              version = $cleanVersion
              tag = $tag
              repository = $repo
              releaseUrl = $releaseUrl
              buildId = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            } | ConvertTo-Json

            $targetServers = @(
              "https://aldrin-banawa.onrender.com/api/build-info/publish"
            )
            foreach ($srv in $targetServers) {
              try {
                Write-Host "Notifying production server at $srv of version $cleanVersion ..."
                $response = Invoke-RestMethod -Uri $srv -Method Post -Body $syncPayload -ContentType "application/json" -TimeoutSec 10
                Write-Host "Server successfully synced to latest release version $cleanVersion"
              } catch {
                Write-Warning "Could not notify $srv : $_"
              }
            }
          } catch {
            Write-Warning "Notification step notice: $_"
          }

          # Write rich download summary to GitHub Actions summary page
          $summary = @"
          # 🎉 JUWEI WMS Windows EXE Ready for Download!

          ### 📦 [Click Here to Open GitHub Release & Download EXE]($releaseUrl)

          | Binary File | Direct Download Link | Size |
          | :--- | :--- | :--- |
          "@

          foreach ($f in $files) {
            $fileName = [System.IO.Path]::GetFileName($f)
            $fileSizeMB = [math]::Round(((Get-Item $f).Length / 1MB), 2)
            $downloadUrl = "https://github.com/$repo/releases/download/$tag/$([System.Uri]::EscapeDataString($fileName))"
            $summary += "`n          | **$fileName** | [⬇️ **Download $fileName**]($downloadUrl) | $fileSizeMB MB |"
          }

          $summary += @"

          ---
          ### 🚀 Installation Instructions:
          1. Click any **Download Link** above (or visit the [Releases Page]($releaseUrl)).
          2. Run the downloaded **`.exe`** file on any Windows 10 / 11 computer.
          3. Enjoy **JUWEI WMS Desktop** with full real-time database sync and zero Google icons.
          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Artifacts to Actions Summary (Backup)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: JUWEI-WMS-Desktop-Windows-EXE
          retention-days: 1
          compression-level: 9
          if-no-files-found: warn
          path: |
            ${{ steps.locate.outputs.dir }}/release/*.exe
            release/*.exe
            ${{ steps.locate.outputs.dir }}/dist/*.exe
            dist/*.exe




