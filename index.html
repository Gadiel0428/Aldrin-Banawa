<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JUWEI WMS Desktop" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>JUWEI WAREHOUSE MANAGEMENT SYSTEM</title>
    <meta name="description" content="A comprehensive Warehouse Management System (JUWEI WMS) built according to standard operating procedures for material receiving, control, stock rotation (FIFO/FEFO), shelf life monitoring, recycling, issuance, and delivery." />
    <meta property="og:title" content="JUWEI WAREHOUSE MANAGEMENT SYSTEM" />
    <meta property="og:description" content="A comprehensive Warehouse Management System (JUWEI WMS) built according to standard operating procedures for material receiving, control, stock rotation (FIFO/FEFO), shelf life monitoring, recycling, issuance, and delivery." />
    <script>
      (function() {
        try {
          // If opened directly in a standalone window/tab outside the AI Studio dev iframe,
          // instantly redirect to the authoritative Render production URL
          // so operators and users are NEVER prompted for a Google/Gmail account login.
          if (window.location.hostname && (window.location.hostname.indexOf('ais-dev-') !== -1 || window.location.hostname.indexOf('run.app') !== -1) && window.self === window.top) {
            var targetUrl = 'https://aldrin-banawa.onrender.com' + window.location.pathname + window.location.search + window.location.hash;
            window.location.replace(targetUrl);
          }
        } catch(e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var svgIcon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%231e1b4b"/><polygon points="32,10 52,21 32,32 12,21" fill="%23818cf8"/><polygon points="12,21 32,32 32,53 12,42" fill="%234338ca"/><polygon points="32,32 52,21 52,42 32,53" fill="%23312e81"/><circle cx="32" cy="21" r="5" fill="%2310b981"/></svg>';
          var dataUrl = 'data:image/svg+xml;utf8,' + svgIcon;
          
          // Remove any default / external favicons
          var links = document.querySelectorAll("link[rel*='icon']");
          links.forEach(function(el) { el.parentNode.removeChild(el); });
          
          var link = document.createElement('link');
          link.type = 'image/svg+xml';
          link.rel = 'icon';
          link.href = dataUrl;
          document.getElementsByTagName('head')[0].appendChild(link);
        } catch(e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          fetch('/build-info.json', { cache: 'no-store' })
            .then(function(r) { return r.json(); })
            .then(function(d) {
              if (d && d.version) {
                document.title = 'JUWEI WAREHOUSE MANAGEMENT SYSTEM v' + d.version;
              }
            }).catch(function() {});
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          // Clean up legacy caches if present
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) {
                if (k.startsWith('juwei-wms-') && k !== 'juwei-wms-v5') {
                  caches.delete(k);
                }
              });
            });
          }

          // In dev server environment, unregister service workers to guarantee clean module loading
          var isDev = window.location.hostname === 'localhost' || window.location.hostname.includes('run.app');
          if (isDev) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              registrations.forEach(function(reg) {
                reg.unregister();
              });
            });
          } else if (window.location.protocol.startsWith('http')) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('./sw.js').catch(function(err) {
                console.log('SW registration notice: ', err);
              });
            });
          }
        }
      })();
    </script>
  </body>
</html>
